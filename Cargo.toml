[package]
name = "webviewrs"
version = "1.0.4"
edition = "2021"
description = "Simple webview app that opens URLs in a minimal native window"
authors = ["Chris Birch"]
repository = "https://github.com/datapointchris/webviewrs"
license = "MIT"
keywords = ["webview", "webkit", "desktop", "webapp"]
categories = ["gui"]

[dependencies]
wry = "0.50"
tao = "0.32"
clap = { version = "4", features = ["derive"] }
dirs = "6"
open = "5"

# wry builds on GTK on exactly these platforms, the set build.rs emits as `gtk`.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ name }"
