[package]
name = "webviewrs"
version = "1.2.5"
edition = "2021"
description = "Simple webview app that opens URLs in a minimal native window"
authors = ["Chris Birch"]
repository = "https://github.com/datapointchris/webviewrs"
license = "MIT"
keywords = ["webview", "webkit", "desktop", "webapp"]
categories = ["gui"]

[dependencies]
wry = "0.57"
tao = "0.32"
clap = { version = "4", features = ["derive", "wrap_help"] }
dirs = "6"
open = "5"

[build-dependencies]
cfg-expr = { version = "0.15", features = ["targets"] }
toml = "0.8"

# The one list of platforms where wry builds on GTK. build.rs reads this cfg and emits `gtk`.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ name }"
