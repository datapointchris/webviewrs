# forge-toolchain: 11
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:

  rust:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      # generated:rust
      # The toolchain ships with the runner image; rust-toolchain.toml, if the
      # repo has one, still decides the version.
      - run: cargo fmt --check

      - run: cargo clippy --all-targets --all-features -- -D warnings

      - run: cargo build --all-targets

      - run: cargo test
