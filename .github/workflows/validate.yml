# forge-toolchain: 11
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:

  rust:
    runs-on: ubuntu-latest
    steps:

      # > custom:before:rust - WebKitGTK development headers
      #
      # wry and tao link against system WebKitGTK, which the runner image does
      # not carry, so every cargo step here fails in glib-sys's build script
      # without this. Same package set as release.yml, which builds the same
      # crate for the same target.
      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/checkout@v7

      # generated:rust
      # The toolchain ships with the runner image; rust-toolchain.toml, if the
      # repo has one, still decides the version.
      - run: cargo fmt --check

      - run: cargo clippy --all-targets --all-features -- -D warnings

      - run: cargo build --all-targets

      - run: cargo test
